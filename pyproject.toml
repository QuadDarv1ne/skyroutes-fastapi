# === Ruff — быстрый линтер и форматтер Python ===
# https://docs.astral.sh/ruff/

target-version = "py311"
line-length = 100
extend-exclude = [".venv", "alembic/versions", "skills"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "B904",  # raise from in except — стилистика
    "SIM108", # ternary instead of if-else — стилистика
]

[lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False в тестах OK
"scripts/*" = ["B008"]

[format]
quote-style = "double"
indent-style = "space"
