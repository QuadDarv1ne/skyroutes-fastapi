name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check app/ tests/ scripts/ || true

      - name: Check formatting with black
        run: black --check app/ tests/ scripts/ || true

      - name: Run pytest
        env:
          TRAVEL_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          TRAVEL_SECRET_KEY: "ci-test-secret-key"
        run: pytest tests/ -v --tb=short

      - name: Run integration smoke-test
        env:
          TRAVEL_DATABASE_URL: "sqlite+aiosqlite:///./ci_test.db"
          TRAVEL_SECRET_KEY: "ci-test-secret-key"
        run: |
          python -m app.seed
          python scripts/test_api.py

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.python-version }}
          path: |
            *.log
            *.db
          retention-days: 1
